name: template

# 템플릿 저장소만 쓰는 검증. 새 프로젝트(pnpm bootstrap)에는 복사하지 않는다.
# 둘 다 10분 넘게 걸려서 PR·push 마다 돌리지 않고, 주 1회 예약 실행과 Actions 탭에서 직접 돌릴 때만 돈다.
# 설치·훅·스크립트·bootstrap 을 크게 바꿨으면 병합 전에 직접 돌린다.
on:
  workflow_dispatch:
  # 매주 월요일 03:00(KST) = 일요일 18:00(UTC). 예약 실행은 기본 브랜치의 워크플로만 돈다.
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

# 액션 고정·checkout 토큰 규칙은 ci.yml 과 같다(scripts/template/ci-required.test.mjs 가 워크플로 전부를 본다).
jobs:
  # Windows 사용자의 첫 실행(설치·공통 검증·루트 시험)이 깨지지 않게 본다. 셸은 README 안내와 같은 Git Bash 다.
  # 웹·앱 자체 도구(Next·Expo)는 운영체제를 가리지 않으므로 여기서는 루트 스크립트만 본다.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - run: node scripts/verify.mjs --common

  # 새 프로젝트를 임시 폴더에 만들어 frozen 설치·doctor·전체 verify·E2E·실제 훅 첫 커밋까지 돈다.
  # DB·Auth·배포에는 요청하지 않는다(실행 환경의 DB 변수를 지운다).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        mode: [web, mobile, both]
    name: smoke-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - name: 템플릿 스모크
        env:
          SMOKE_MODE: ${{ matrix.mode }}
        run: node scripts/template/smoke-template.mjs --mode "$SMOKE_MODE" --evidence smoke-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-evidence-${{ matrix.mode }}
          path: smoke-evidence/
          if-no-files-found: ignore
          retention-days: 7
