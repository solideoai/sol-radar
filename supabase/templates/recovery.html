<!-- 비밀번호 재설정 메일. 링크는 웹의 /auth/confirm 을 거쳐 새 비밀번호 화면(/auth/password)으로 간다.
     로컬은 supabase/config.toml 이 이 파일을 읽는다. 클라우드는 대시보드 Authentication → Emails 의
     "Reset password" 에 같은 내용을 붙여 넣는다(docs/boilerplate/database.md). -->
<h2>비밀번호 재설정</h2>
<p>아래 링크를 열어 새 비밀번호를 정하세요.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/password"
    >새 비밀번호 정하기</a
  >
</p>
<p>요청한 적이 없다면 이 메일은 무시하셔도 됩니다. 비밀번호는 바뀌지 않습니다.</p>
