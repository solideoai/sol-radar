# SOL RADAR 로컬 데모 스택 (ADR-017). DB·Auth 는 Supabase 클라우드라 postgres 서비스가 없다.
# 사용: cp infra/env/demo.env.example infra/.env 후 값을 채우고
#   docker compose -f infra/compose.yaml up -d --build
# 프로필을 붙이지 않는다. 같은 5개 서비스가 뜬다.
# 호스트 포트는 127.0.0.1 에만 열고, 충돌하면 *_HOST_PORT 로 바꾼다.
# 프로젝트 이름은 sol-radar 가 아니다. 로컬 Supabase CLI 가 supabase/config.toml 의 project_id(sol-radar)를
# 같은 Compose 라벨로 쓰므로, 같은 이름이면 서로를 orphan 으로 보고 --remove-orphans 가 상대 컨테이너를 지운다.
name: sol-radar-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:8.8.3-alpine
    # 비밀번호가 프로세스 인자·docker inspect 에 남지 않도록 설정을 stdin 으로 넘긴다.
    # 첫 인자가 redis-server 가 아니면 공식 entrypoint 가 권한 강등을 건너뛰므로(su-exec 도 없다),
    # entrypoint 와 같은 방식(data 소유권 정리 + setpriv)으로 redis 사용자로 내린다.
    command:
      - sh
      - -c
      - |
        umask 0077
        chown -R redis /data || exit 1
        exec /bin/setpriv --reuid redis --regid redis --clear-groups --nnp \
          redis-server - <<EOF
        requirepass "$$REDIS_PASSWORD"
        appendonly yes
        EOF
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 를 infra/.env 에 채운다}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 를 infra/.env 에 채운다}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 를 infra/.env 에 채운다}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
    volumes:
      - miniodata:/data
    restart: unless-stopped
    logging: *default-logging
    # 이미지에 curl·wget 이 없다. bash 의 /dev/tcp 로 GET /minio/health/live 200 을 본다.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r line <&3
          [[ "$$line" == *" 200"* ]]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped
    logging: *default-logging
    # 이미지에 curl·wget 이 없다. bash 의 /dev/tcp 로 GET /readyz 200 을 본다.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r line <&3
          [[ "$$line" == *" 200"* ]]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-gateway:
    build:
      context: ..
      dockerfile: services/ai/Dockerfile
    environment:
      SOL_RUN_MODE: ${SOL_RUN_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_HOSTED_APPROVED: ${AI_HOSTED_APPROVED:-}
      AI_FALLBACK_TO_MOCK: ${AI_FALLBACK_TO_MOCK:-}
      KEV_ENABLED: ${KEV_ENABLED:-}
      KEV_ALLOW_KO_STATE: ${KEV_ALLOW_KO_STATE:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      KEV_BASE_URL: ${KEV_BASE_URL:-}
      KEV_MODEL_ID: ${KEV_MODEL_ID:-}
      KEV_QUESTION_SET: ${KEV_QUESTION_SET:-}
      KEV_API_KEY: ${KEV_API_KEY:-}
    # 호스트에서 띄운 서비스(예: 로컬 Supabase CLI)에 닿기 위한 호스트 별칭. 모델 엔드포인트는 HTTPS 라 이 별칭을 쓰지 않는다(ADR-025)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AI_GATEWAY_HOST_PORT:-8000}:8000"
    restart: on-failure:3
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../web
      dockerfile: worker/Dockerfile
    init: true
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL 를 infra/.env 에 채운다}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY 를 infra/.env 에 채운다}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 를 infra/.env 에 채운다}@redis:6379
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 를 infra/.env 에 채운다}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 를 infra/.env 에 채운다}
      AI_GATEWAY_URL: http://ai-gateway:8000
      SOL_RUN_MODE: ${SOL_RUN_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-}
      G2B_BID_NOTICE_SERVICE_KEY: ${G2B_BID_NOTICE_SERVICE_KEY:-}
      G2B_PRE_SPEC_SERVICE_KEY: ${G2B_PRE_SPEC_SERVICE_KEY:-}
      G2B_ORDER_PLAN_SERVICE_KEY: ${G2B_ORDER_PLAN_SERVICE_KEY:-}
      G2B_INDUSTRY_MASTER_SERVICE_KEY: ${G2B_INDUSTRY_MASTER_SERVICE_KEY:-}
      # 주기·시간(선택). 값 없이 키만 두면 infra/.env·셸에 값이 있을 때만 넘어가고, 없으면 컨테이너에 변수가 없어
      # 코드 기본값을 쓴다(G2B_INGEST_INTERVAL_MINUTES 30분, ANALYSIS_STALE_*_MS 600000, ANALYSIS_RECONCILE_INTERVAL_MS 60000).
      G2B_INGEST_INTERVAL_MINUTES:
      ANALYSIS_STALE_QUEUED_MS:
      ANALYSIS_STALE_RUNNING_MS:
      ANALYSIS_RECONCILE_INTERVAL_MS:
      # 수집 worker 입력(C3). 이미지 컨텍스트가 web/ 라 fixture·소스 registry 는 저장소에서 읽기 전용으로 붙인다.
      # 컨테이너 안 경로는 여기서 고정한다(infra/.env 로 바꾸지 않는다). 호스트에서 직접 돌릴 때는 코드 기본값(저장소 경로)을 쓴다.
      FIXTURES_DIR: /srv/sol-radar/fixtures
      SOURCES_REGISTRY_FILE: /srv/sol-radar/infra/sources/registry.yaml
    volumes:
      - ../fixtures:/srv/sol-radar/fixtures:ro
      # infra/sources/registry.yaml 은 C3 병합 때 들어온다. 폴더가 없으면 Compose 가 빈 폴더를 만들고 live 모드는 registry 가 없어 기동을 거부한다.
      - ../infra/sources:/srv/sol-radar/infra/sources:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure:3
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('fs').statSync(process.env.WORKER_HEARTBEAT_FILE||'/tmp/sol-worker-heartbeat');process.exit(Date.now()-s.mtimeMs<30000?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redisdata:
  miniodata:
  qdrantdata:
