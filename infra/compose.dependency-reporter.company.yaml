name: sol-radar-dependency

services:
  dependency-reporter:
    image: sol-radar-ai-worker-worker
    init: true
    env_file:
      - .env.worker.local
    environment:
      AI_GATEWAY_URL: "http://172.20.0.1:8000"
    command:
      - node
      - --conditions=react-server
      - --import
      - tsx
      - worker/dependency-reporter-main.ts
    networks:
      - redis-existing
    restart: unless-stopped

networks:
  redis-existing:
    external: true
    name: redis_default
