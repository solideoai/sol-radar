# SOL RADAR 모델 라우터 (ADR-025). 회사 GPU 서버 안에서 돈다.
#
# 회사 nginx 는 location 하나(https://acropolissg.com/sol-radar)만 등록하고 이 라우터(127.0.0.1:8080)로 넘긴다.
# 이 라우터가 경로 접두어로 두 모델 런타임을 나눈다.
#   /sol-radar/qwen/<path>  ->  vLLM      127.0.0.1:8001/<path>
#   /sol-radar/kev/<path>   ->  kev.serve 127.0.0.1:8009/<path>
# 바깥 nginx 가 /sol-radar 접두어를 떼고 넘겨도(/qwen/..., /kev/...) 같은 곳으로 간다.
# 인증은 각 런타임이 한다(vLLM --api-key, KEV_API_KEY). Authorization 헤더는 그대로 통과시키고 여기서 기록하지 않는다.

log_format sol_router '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 127.0.0.1:8080;
  server_name _;

  # 키·쿼리가 로그에 남지 않게 $request 대신 $uri 만 기록한다
  access_log /var/log/nginx/access.log sol_router;

  # 추출 요청은 첨부 본문을 담아 크고, 추론은 오래 걸린다
  client_max_body_size 20m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_buffering off;

  # 라우터 자체 확인용(인증 없음, 비밀 없음). 바깥에서 TLS·경로 등록만 확인할 때 쓴다
  location ~ ^/(?:sol-radar/)?healthz$ {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(?:sol-radar/)?qwen/(.*)$ {
    proxy_pass http://127.0.0.1:8001/$1$is_args$args;
  }

  location ~ ^/(?:sol-radar/)?kev/(.*)$ {
    proxy_pass http://127.0.0.1:8009/$1$is_args$args;
  }

  location / {
    return 404;
  }
}
