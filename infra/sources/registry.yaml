# 수집 소스 registry (docs/15-DATA-CONTRACTS.md §8, ADR-020). OfficialApiConnector 는 여기 등록한 엔드포인트만 부른다.
# 승인 전·endpoint 없음·fieldMapping 비어 있음·서비스키 env 없음인 소스는 부르지 않는다(source-registry.ts callableSource).
# 실측 근거: docs/evidence/phase-0/external-deps-api-20261019.md (2f, 2026-10-19). data.go.kr 4서비스 모두 https 로 200 을 받았다.
# 서비스키는 값이 아니라 env 이름만 둔다(07 §2.2, ADR-022). sampleResponses 는 담당자 필드를 가린 녹음 사본이다.
schemaVersion: sol-sources/v0.1
sources:
  - key: g2b-bid-notice
    displayName: 나라장터 입찰공고정보서비스
    provider: 조달청 / data.go.kr
    serviceId: "15129394"
    serviceKeyEnv: G2B_BID_NOTICE_SERVICE_KEY
    approvalStatus: APPROVED
    endpoint:
      baseUrl: https://apis.data.go.kr/1230000/ad/BidPublicInfoService
      operations: [getBidPblancListInfoServc, getBidPblancListInfoChgHstryServc]
    method: GET
    quota: { daily: 1000, tps: 30 }
    # 07 §3.1 표. 원본 필드 → NormalizedBid 필드. 구현은 normalize-g2b.ts
    fieldMapping:
      bidNtceNo: noticeId
      bidNtceOrd: amendmentNo
      bidNtceNm: title
      dminsttNm: agency
      asignBdgtAmt: budgetKrw
      presmptPrce: budgetKrw (asignBdgtAmt 가 비었을 때)
      bidNtceDt: noticeDate
      bidClseDt: deadlineAt
      bidNtceDtlUrl: sourceUrl
      bidNtceUrl: sourceUrl (bidNtceDtlUrl 이 비었을 때)
      ntceKindNm: status (등록·재공고 OPEN, 변경 AMENDED, 취소 CANCELLED)
      orderPlanUntyNo: planRef
      bfSpecRgstNo: preSpecRef
      ntceSpecDocUrl1~10: attachments[].url
      ntceSpecFileNm1~10: attachments[].name
    changeNoticeUrl: null
    redistributionLimit: "API 데이터: 이용허락범위 제한 없음"
    sampleResponses:
      - fixtures/recorded/15129394/getBidPblancListInfoServc.20261019.masked.json
      - fixtures/recorded/15129394/getBidPblancListInfoServc.20261019.7d-p1.masked.json
      - fixtures/recorded/15129394/getBidPblancListInfoServc.20261019.error07.masked.json
      - fixtures/recorded/15129394/getBidPblancListInfoChgHstryServc.20261019.masked.json
    lastVerifiedAt: "2026-10-19"

