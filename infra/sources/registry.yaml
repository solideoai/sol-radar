  - key: g2b-bid-license-limit
    displayName: 나라장터 입찰공고정보서비스(면허제한)
    provider: 조달청 / data.go.kr
    serviceId: "15129394"
    serviceKeyEnv: G2B_BID_NOTICE_SERVICE_KEY
    approvalStatus: APPROVED
    endpoint:
      baseUrl: https://apis.data.go.kr/1230000/ad/BidPublicInfoService
      operations: [getBidPblancListInfoLicenseLimit]
    method: GET
    quota: { daily: 1000, tps: 30 }
    fieldMapping:
      bidNtceNo: 요청 bidNtceNo (noticeId) 와 같은 행만 쓴다
      bidNtceOrd: structuredQualifications[].value.bidNtceOrd (차수, 원본 보존)
      lcnsLmtNm: structuredQualifications[kind=LICENSE_LIMIT].name / .code ("이름/코드" 를 나눔, 코드는 4자리 업종코드)
      permsnIndstrytyList: structuredQualifications[kind=PERMITTED_INDUSTRY] ("[이름/코드],…" 항목마다 한 행)
      lmtGrpNo: 정렬 키(그룹). value 에 보존. AND/OR 뜻은 미검증(16 미결정 19번)
      lmtSno: 정렬 키(일련번호). value 에 보존
      indstrytyMfrcFldList: structuredQualifications[].value 에만 보존
      rgstDt: structuredQualifications[].value 에만 보존
      bsnsDivNm: structuredQualifications[].value 에만 보존
    changeNoticeUrl: null
    redistributionLimit: "API 데이터: 이용허락범위 제한 없음"
    sampleResponses:
