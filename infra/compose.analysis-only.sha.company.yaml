# Analysis 전용 Worker 이미지 교체용 덮어쓰기(2026-10-27). 실행서: infra/company/README.md §8.6.
# 회사 원본 infra/compose.analysis-only.company.yaml 은 그대로 둔다. 원본은 회사 운영 이미지 sol-radar-ai-worker-worker:latest 를 쓴다.
# 이 파일을 원본 뒤에 함께 주면 같은 프로젝트·같은 서비스(sol-radar-analysis-only / analysis-worker)가 git SHA 태그의 새 이미지로 돈다.
# latest 태그는 빌드하거나 태그하지 않는다(README §7.11). 되돌리기는 이 파일 없이 원본만으로 up 하면 latest 이미지로 돌아간다.
# 사용: docker compose -f infra/compose.analysis-only.company.yaml -f infra/compose.analysis-only.sha.company.yaml <명령>
services:
  analysis-worker:
    image: sol-radar-analysis-worker:${ANALYSIS_WORKER_TAG:?배포할 git SHA}
    build:
      context: ../web
      dockerfile: worker/Dockerfile
    # 교체할 때 진행 중 분석 job(gateway 추출·결정 모델 호출)이 끝나기를 기다린다. 넘으면 멈춘 run 복구가 다시 잡는다.
    stop_grace_period: 180s
