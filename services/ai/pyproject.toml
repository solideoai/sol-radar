[project]
name = "sol-ai"
version = "0.1.0"
description = "SOL RADAR AI gateway (Phase 0 골격)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "olefile>=0.47",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# eval/sol_eval 도 1차 패키지다(import 정렬)
src = [".", "src", "eval"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "sol-eval",
]

# 평가셋 CLI(eval/sol_eval)는 같은 가상환경의 workspace 멤버다: uv run python -m sol_eval …
[tool.uv.workspace]
members = ["eval"]

[tool.uv.sources]
sol-eval = { workspace = true }
