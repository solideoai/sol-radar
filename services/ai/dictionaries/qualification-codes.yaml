# 자격 코드 사전(docs/03 §4.1·§4.4 8단계, docs/08 §5.1·§6.1). gateway 가 qualifications[].code 를 이 사전으로 채운다.
# 모델이 낸 code 는 쓰지 않는다. 사전에 없으면 null 이고 규칙 엔진은 그 항목을 NEEDS_REVIEW 로 낸다.
# en 은 Kev 영어 state(docs/03 §5.6)에 쓰는 라벨이다.
# 같은 내용의 TS 사본이 web/server/scoring/qualification-codes.ts 에 있다(찾기 규칙도 같다).
#
# 찾기: 이름을 소문자·공백 제거로 정규화 → 이름·별칭 정확 일치 → 길이 4 이상 별칭 중 이름에 포함된 가장 긴 것 → 없으면 null.
#
# 미검증 가정: 코드 이름과 별칭은 v0.1 가정이다. 나라장터 업종 마스터·실제 공고 표기로 확인하면 고친다.
